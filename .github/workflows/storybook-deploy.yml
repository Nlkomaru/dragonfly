name: Deploy Storybook

# packages/ui の Storybook をビルドして Cloudflare (dragonfly-sb.vrc.nikomaru.dev) に配置する。
# main に push されたら自動で、任意のタイミングなら workflow_dispatch で手動実行できる。
on:
  push:
    branches:
      - main
    paths:
      - packages/ui/**
      - pnpm-lock.yaml
      - .github/workflows/storybook-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        # 成果物は packages/ui/storybook-static に出力される (wrangler.jsonc で同じディレクトリを指している)。
        run: pnpm build-storybook

      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID は BSM(nikomaru プロジェクト)管理に移行済み。
      # 以降のステップの env に入るため、run: 側で改めて渡す必要はない。
      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            1d10a8b9-8326-47e3-863f-b49900de5893 > CLOUDFLARE_API_TOKEN
            2bad9e23-82af-4fba-b514-b49900e1632f > CLOUDFLARE_ACCOUNT_ID

      - name: Deploy to Cloudflare
        # wrangler.jsonc の routes で dragonfly-sb.vrc.nikomaru.dev を custom_domain として指定済み。
        # 初回実行時に DNS レコードとカスタムドメインが作成されるため、
        # 利用アカウントが vrc.nikomaru.dev ゾーンをホストしている必要がある。
        run: pnpm --dir packages/ui exec wrangler deploy
