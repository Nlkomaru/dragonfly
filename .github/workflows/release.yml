name: Release

# ドラフトを人手で公開する運用をやめ、このワークフロー1本でリリースを完了させる。
#
# なぜ1ワークフローにまとめるのか:
#   GITHUB_TOKEN が作成・公開したリリースは `on: release: [published]` を発火させない。
#   そのため「release-drafter が公開 → 別ワークフローがビルド」という構成は静かに動かない。
#   ここでは採番・ビルド・公開を needs でつないで単一ワークフロー内で完結させる。
#
# 公開のタイミング:
#   先に公開してからビルドすると、アセットが揃うまでの間 updater が参照する latest.json が
#   存在しない状態になる。そのため「ドラフトに対してビルド → 全アセット添付後に公開」の順にする。
#   ドラフトは公開までの足場でしかなく、人手で触る必要はない。
#
# latest.json の作り方:
#   updater のマニフェスト latest.json は3プラットフォーム共通の同名アセットだが、
#   tauri-action は「既存を読む → 自分の分をマージ → 上げ直す」形で更新するため、
#   3ジョブが並列に書いても3プラットフォーム分が揃う。生成は tauri-action に任せる。
#
#   かつては max-parallel: 1 で直列化していた。当時のコメントは「並列だと片方の
#   書き込みが失われる」と説明していたが、上記のとおりマージされるので誤りだった。
#   直列化は1リリースあたり約20分を余計に払っていただけなので、単に外した。
#
#   既知の穴として、マージは read-modify-write なので「読んだ後に他が書いた」
#   取りこぼしは理論上あり得る。競合として検出されないため再試行も発火せず、
#   ビルドが全部緑のまま1プラットフォーム欠けた latest.json が出る可能性が残る。
#   実運用では観測されておらず（姉妹リポジトリ kodou は3並列のまま14リリース）、
#   検出用の仕組みを持つ対価に見合わないと判断してこの穴は受け入れている。
#
# 実行の契機:
#   main へのマージで自動的に走り、そのままリリースまで完了する。
#   デスクトップアプリの成果物に影響しない変更（Web / ドキュメントのみ）では走らせない。
#   リリースに載せたくない PR には `skip-release` ラベルを付ける。
on:
  push:
    branches:
      - main
    paths-ignore:
      - apps/web/**
      - docs/**
      - "**/*.md"
      - .github/workflows/web-deploy.yml
      - .github/workflows/db-migrate.yml
      - .github/workflows/storybook-deploy.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ビルドのみ行い、リリースを公開しない"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # main にマージ済みの PR ラベルからバージョンを採番し、変更履歴を書いたドラフトを用意する。
  # ここではまだ公開しない（publish: false）。
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.drafter.outputs.tag_name }}
      release_id: ${{ steps.drafter.outputs.id }}
    steps:
      - id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    name: Build ${{ matrix.platform }}
    strategy:
      # latest.json は tauri-action がマージして更新するため、3プラットフォームを
      # 並列に走らせても内容が揃う（かつての max-parallel: 1 は不要だった）。
      # fail-fast: false は、1つ失敗しても他の成果物を見て原因を切り分けたいため。
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # バージョンの正はリリースタグ（release-drafter が採番）であり、
      # tauri.conf.json の version はリポジトリ上では更新していない。
      # 一方 latest.json とバンドルのバージョンは tauri.conf.json から作られるため、
      # ここでタグの値を書き込んでおかないと、更新が届かない・古い版が配布される。
      - name: Sync app version from release tag
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          version="${TAG#v}"
          config="apps/desktop/src-tauri/tauri.conf.json"
          # jq は in-place 編集ができないので一時ファイル経由で書き戻す。
          jq --arg version "$version" '.version = $version' "$config" > "$config.tmp"
          mv "$config.tmp" "$config"
          echo "app version set to $version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          # macOS は Apple Silicon(aarch64)限定でビルドする。macos-latest のホストは
          # aarch64 なので追加ターゲットは不要（Intel 対応が要るなら universal に戻す）。
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libdbus-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cargo 由来のキャッシュ。タグ起動のためコンパイル済み依存はヒットしにくいが、
      # registry のダウンロード短縮と同一タグ再実行・手動再ビルドで効く。
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # 自動更新パッケージ(.sig)の署名に使う鍵。BSM(nikomaru プロジェクト)から取得し、
      # このステップ以降のジョブ内 env として TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) に入る。
      # tauri-action は cargo tauri build を子プロセスとして起動するだけなので、
      # with: 経由で渡す必要はなく、プロセス環境変数のまま読み取られる。
      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            92dc0308-8f81-49e1-a013-b49900de59c1 > TAURI_SIGNING_PRIVATE_KEY
            5dcef8cd-92ce-4779-bdb8-b49900de5a58 > TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # 既存のドラフトへアセットを足す。releaseId を渡すと release-drafter が書いた
          # 変更履歴（name / body）を tauri-action が上書きしない。
          releaseId: ${{ needs.draft.outputs.release_id }}
          # bundle.targets が "all" のため Windows は .msi と -setup.exe(NSIS) の
          # 両方に .sig が出る。tauri-action の既定は MSI を windows-x86_64 に割り当てるが、
          # 更新には NSIS を使いたいので明示的に切り替える。
          # NSIS は Tauri が既定の配布形式として推奨しており、更新時のサイレント
          # インストールが素直に通る（MSI は再起動要求が絡みやすい）。
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # 全アセットと latest.json が揃ってから公開する。
  # ビルドが1つでも失敗すれば needs により publish がスキップされ、
  # 欠けたリリースはドラフトのまま公開されない。
  publish:
    needs: [draft, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          # ドラフトの段階では git のタグがまだ存在しないため、`gh release edit <tag>` では
          # 対象を解決できないことがある。確実な release id を使って API を直接叩く。
          # make_latest=true で /releases/latest が確実にこのリリースを指すようにする。
          # updater の endpoint がこのパスを参照しているため、ここを外すと更新が届かない。
          gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest=true > /dev/null
          echo "published $TAG"
