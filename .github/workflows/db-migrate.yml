name: Apply D1 migrations

# apps/web/migrations の未適用分を本番の D1 に流す。
# スキーマ変更は破壊的になりうるため、自動では走らせず必ず手動で実行する。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "適用せずに、実行される予定のマイグレーションだけを表示する"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List pending migrations
        run: pnpm --dir apps/web exec wrangler d1 migrations list dragonfly --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: pnpm --dir apps/web exec wrangler d1 migrations apply dragonfly --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
