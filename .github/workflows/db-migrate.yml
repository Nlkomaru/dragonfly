name: Apply D1 migrations

# apps/web/migrations の未適用分を本番の D1 に流す。
# スキーマ変更は破壊的になりうるため、自動では走らせず必ず手動で実行する。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "適用せずに、実行される予定のマイグレーションだけを表示する"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@v2
        with:
          project: "dragonfly"
          env: "production"
          shared-keys: CLOUDFLARE_ACCOUNT_ID

      - name: List pending migrations
        run: pnpm --dir apps/web exec cf d1 migrations list 6d3b4492-c258-4ade-b97d-50d73563ed5a

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: pnpm --dir apps/web exec cf d1 migrations apply 6d3b4492-c258-4ade-b97d-50d73563ed5a
