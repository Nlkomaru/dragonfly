name: Deploy Web

# apps/web (TanStack Start) をビルドして Cloudflare Workers (dragonfly.vrc.nikomaru.dev) に配置する。
# main に push されたら自動で、任意のタイミングなら workflow_dispatch で手動実行できる。
# D1 のマイグレーションはここでは適用しない (db-migrate.yml で人手のタイミングを選ぶ)。
on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/core/**
      - packages/ui/**
      - packages/api-client/**
      - pnpm-lock.yaml
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Build
        run: pnpm build:web

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@v2
        with:
          project: "dragonfly"
          env: "production"
          shared-keys: CLOUDFLARE_ACCOUNT_ID
          export-json: ${{ runner.temp }}/secrets.json
          export-json-keys: |
            DISCORD_CLIENT_ID
            DISCORD_CLIENT_SECRET
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            ALLOWED_DISCORD_USER_IDS

      - name: Deploy to Cloudflare
        # dragonfly.vrc.nikomaru.dev をカスタムドメインとして指定済み。
        # 初回実行時に DNS レコードとカスタムドメインが作成される。
        # secret は --secrets-file で Worker バージョンと同時に登録する。
        run: pnpm --dir apps/web exec cf deploy --prebuilt --secrets-file "${{ runner.temp }}/secrets.json"
