name: Release Drafter

# PR のラベルから、その PR がどのバージョンに載るかを先に見えるようにしておく。
# main への push では走らせない。マージ後は release.yml が採番からリリース公開までを
# 一気に行うため、ここで同じドラフトを触ると2つのワークフローが競合するからである。
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
