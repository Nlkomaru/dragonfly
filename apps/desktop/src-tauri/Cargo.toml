[package]
name = "dragonfly"
version = "0.1.0"
description = "dragonfly desktop app"
edition = "2021"
rust-version = "1.88"

[lib]
# Tauri 2 のモバイル対応に必要な名前。デスクトップのみでもこの構成に揃えておく。
name = "dragonfly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: ローカル画像を asset プロトコル（http://asset.localhost/...）で
# WebView に読ませるために必要。無いとハンドラ自体がコンパイルされない。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# 写真パイプライン用の依存。
walkdir = "2"            # スクリーンショットの再帰走査
rayon = "1"              # 走査・ハッシュ・変換の並列化
sha2 = "0.10"            # 元 PNG の SHA-256
hex = "0.4"              # ハッシュの16進表現
chrono = "0.4"           # ファイル名 / mtime のローカル時刻解釈
flate2 = "1"             # iTXt の zlib 圧縮テキスト展開
num_cpus = "1"           # 変換の同時実行数
# PNG のデコードと、一覧用サムネイルの JPEG 書き出しだけできれば良い。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# AVIF エンコード（純 Rust）。asm 機能はビルドに nasm を要求するため既定では外す。
# 速度が必要なら nasm を用意したうえで features = ["asm"] を足す。
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"              # ravif に渡す画素型
# 一覧の読み込み前に出すプレースホルダ (BlurHash) の計算。
# 成分数は @dragonfly/core の BLURHASH_COMPONENTS_X / Y と必ず同じ値にすること。
# image / gdk-pixbuf 連携の機能は使わないので既定のまま（どちらも既定で無効）。
blurhash = "0.2"
# ハッシュキャッシュ。bundled でシステムの libsqlite3 に依存しない。
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTP。既定機能はシステム OpenSSL を引くため rustls に固定する。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
keyring = "4"            # API キーを OS のキーチェーンに保存
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

# macOS のキーチェーンバックエンドはこのターゲットでのみ有効化する。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

# 自動更新はデスクトップ専用プラグイン。モバイルでビルドすると解決に失敗するため
# ターゲットを限定して依存に入れる。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
